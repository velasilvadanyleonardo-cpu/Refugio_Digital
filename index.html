<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refugio Digital - Red de Adopción, Rescate y Tienda</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col font-sans">

  <!-- CAPA DE BLOQUEO / AUTENTICACIÓN OBLIGATORIA -->
  <div id="authWall" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-brand-100 space-y-6 my-auto">

      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto text-2xl">
          <i class="fa-solid fa-shield-cat"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Refugio<span class="text-brand-500">Digital</span></h2>
        <p class="text-xs text-slate-500">Inicia sesión o crea una cuenta para acceder a la plataforma.</p>
      </div>

      <!-- PESTAÑAS LOGIN / REGISTRO -->
      <div class="flex border-b border-slate-200">
        <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold text-brand-600 border-b-2 border-brand-600 cursor-pointer">Iniciar Sesión</button>
        <button type="button" id="tabRegBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 cursor-pointer">Crear Cuenta</button>
      </div>

      <!-- FORMULARIO LOGIN -->
      <form id="formAuthLogin" onsubmit="procesarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contraseña</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
        </div>
        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium transition shadow-md cursor-pointer">
          Ingresar
        </button>
      </form>

      <!-- FORMULARIO REGISTRO -->
      <form id="formAuthRegister" onsubmit="iniciarRegistro
