<!-- MODAL DE GOOGLE Y SELECCIÓN DE PERFIL -->
<div id="google-modal">
    <div class="google-box" style="max-height: 90vh; overflow-y: auto;">
        <h3 style="margin-bottom: 6px; color: var(--text-main); font-size: 20px; font-weight: 700;">Únete a Refugio Digital</h3>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 14px; line-height: 1.4;">Conéctate con Google y cuéntanos cuál será tu rol en la red de ayuda de SJL y Lima.</p>
        
        <!-- Selector de Perfiles -->
        <div style="text-align: left; margin-bottom: 16px;">
            <label style="font-size: 12px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Selecciona tu perfil:</label>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label class="role-option">
                    <input type="radio" name="user_role" value="comun" checked>
                    <span>🧑‍💻 Persona Común / Adoptante</span>
                </label>
                <label class="role-option">
                    <input type="radio" name="user_role" value="profesional">
                    <span>🎓 Profesional / Rescatista Independiente</span>
                </label>
                <label class="role-option">
                    <input type="radio" name="user_role" value="veterinaria">
                    <span>🏥 Veterinaria / Clínica Aliada</span>
                </label>
            </div>
        </div>

        <button class="btn-main" onclick="simularLoginGoogleExitoso()" style="margin-bottom: 10px;">Continuar con Google</button>
        <button class="btn-secundario" onclick="cerrarGoogleModal()">Cancelar</button>
    </div>
</div>
