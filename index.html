<!-- PÁGINA DE BIENVENIDA (VIBRANTE Y HERMOSA) -->
<div id="landing-screen">
    <div>
        <div class="landing-top-badge">✨ SJL & Lima, Perú</div>
        
        <div class="landing-hero-box">
            <div class="landing-emojis-row">
                <span>🐶</span><span>🐱</span><span>❤️</span>
            </div>
            <h1>Refugio Digital</h1>
            <p>Unimos corazones con patitas. Encuentra a tu compañero ideal o ayuda a un peludito en situación de rescate.</p>
        </div>

        <div class="landing-features-grid">
            <div class="landing-feat-card">
                <span>🏡</span>
                <h4>Adopta con Amor</h4>
                <p>Dale un hogar seguro a perritos y gatitos.</p>
            </div>
            <div class="landing-feat-card">
                <span>🚨</span>
                <h4>Reporta Alertas</h4>
                <p>Salva vidas avisando de casos en tu zona.</p>
            </div>
        </div>
    </div>

    <div class="landing-actions-vibrant">
        <button class="btn-main" style="padding: 16px; font-size: 16px; border-radius: 16px; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);" onclick="abrirGoogleModalDesdeLanding()">
            ✨ Comenzar Ahora con Google
        </button>
        <button class="btn-secundario" style="background: white; padding: 15px; font-size: 15px; border-radius: 16px; border: 1px solid var(--border);" onclick="explorarSinCuenta()">
            👀 Explorar sin cuenta
        </button>
    </div>
</div>
